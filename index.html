

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#f58220">

<title>マイセブン銀行</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#f4f5f7;color:#292929;font-family:-apple-system,BlinkMacSystemFont,sans-serif}

header{background:white;padding:15px 18px;display:flex;align-items:center;gap:11px}

.logo{width:43px;height:43px}

.brand{font-size:19px;font-weight:800}

.sub{font-size:10px;color:#888;letter-spacing:1px}

.menu{margin-left:auto;border:0;background:white;font-size:25px}

.demo{padding:8px 18px;background:#fff7ef;color:#a75a19;font-size:10px}

.hero{padding:24px 20px 42px;background:linear-gradient(120deg,#ff9b3d,#f58220);color:white}

.hero small{opacity:.9}

.hero h2{margin:8px 0 0;font-size:23px}

.balance{position:relative;margin:-25px 14px 0;padding:20px;background:white;border-radius:16px;box-shadow:0 5px 20px #0000000b}

.label{color:#777;font-size:12px}

.money{font-size:35px;font-weight:800;margin:12px 0 20px}

.money small{font-size:18px}

.account{border-top:1px solid #eee;padding-top:15px;display:flex;justify-content:space-between;align-items:center}

.number{font-size:21px;font-weight:750;letter-spacing:1px;margin-top:5px}

.pill{font-size:10px;color:#d96e14;background:#fff0e3;border-radius:6px;padding:6px 9px}

main{padding:0 14px 100px}

.heading{font-size:16px;font-weight:750;margin:24px 3px 13px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}

.tile{background:white;border:0;border-radius:13px;padding:15px 2px;min-width:0}

.tile svg{width:25px;height:25px;color:#e97816;margin-bottom:9px}

.tile b{display:block;font-size:11px}

.tile small{display:block;color:#999;font-size:9px;margin-top:5px}

.panel{background:white;border-radius:14px;padding:0 14px}

.tx{display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid #eee}

.tx:last-child{border:0}

.txicon{width:40px;height:40px;border-radius:12px;background:#fff0e3;color:#e97816;display:grid;place-items:center;flex-shrink:0}

.txicon svg{width:22px;height:22px}

.txinfo{flex:1;min-width:0}

.txname{font-size:12px;font-weight:700}

.date{font-size:10px;color:#999;margin-top:5px}

.amount{font-size:12px;font-weight:750;white-space:nowrap}

.plus{color:#15845d}

.more{width:100%;padding:15px;background:white;border:0;color:#df7518;font-weight:700;font-size:12px}

.page{display:none}.page.active{display:block}

.info{display:flex;justify-content:space-between;gap:12px;padding:17px 0;border-bottom:1px solid #eee;font-size:12px}

.info span{color:#888}.info strong{text-align:right}

nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e8e8e8;display:grid;grid-template-columns:repeat(3,1fr);padding:9px 0 calc(7px + env(safe-area-inset-bottom))}

nav button{border:0;background:white;color:#999;font-size:10px}

nav svg{width:22px;height:22px;display:block;margin:0 auto 4px}

nav button.active{color:#f58220;font-weight:700}

.notice{text-align:center;color:#999;font-size:10px;line-height:1.8;padding:22px 5px}

.toast{display:none;position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 16px;border-radius:9px;z-index:5;white-space:nowrap}

@media(min-width:600px){body{max-width:520px;margin:auto}nav{max-width:520px;left:50%;transform:translateX(-50%)}}

</style>

</head>

<body>

<header>

<svg class="logo" viewBox="0 0 48 48" aria-label="オレンジ・緑・赤のロゴ">

  <rect width="48" height="48" rx="9" fill="#ffffff"/>

  <path d="M7 9H41V16H26L17 39H9L20 16H7Z" fill="#f58220"/>

  <path d="M7 20H18L15 27H7Z" fill="#00865a"/>

  <path d="M24 20H40V27H21Z" fill="#e53935"/>

</svg>

<rect width="48" height="48" rx="11" fill="#fff0e3"/>

<path d="M8 9H40V16H27L17 39H9L20 16H8Z" fill="#f58220"/>

<path d="M25 23H38V30H22Z" fill="#f58220"/>

</svg>

<div><div class="brand">マイセブン銀行</div><div class="sub">MY BANKING</div></div>

<button class="menu" onclick="toast('個人用デモ画面です')" aria-label="メニュー">☰</button>

</header>



<section class="hero"><small>おかえりなさい</small><h2>口座状況</h2><div style="font-size:12px;margin-top:7px">いつもの口座を、ここで確認。</div></section>

<section class="balance">

<div style="display:flex;justify-content:space-between;align-items:center"><span class="label">普通預金残高</span><span class="pill">普通預金</span></div>

<div class="money"><small>￥</small>72,800</div>

<div class="account"><div><div class="label">口座番号</div><div class="number">2284117</div></div><span class="pill">口座情報</span></div>

</section>

<main>

<section id="home" class="page active">

<div class="heading">お取引メニュー</div>

<div class="grid">

<button class="tile" onclick="showPage('history')">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M6 10l6-6 6 6M18 14l-6 6-6-6"/></svg>

<b>入出金明細</b><small>取引を確認</small></button>

<button class="tile" onclick="showPage('account')">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>

<b>口座情報</b><small>登録情報を確認</small></button>

<button class="tile" onclick="showPage('history')">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4M8 10h5"/></svg>

<b>利用履歴</b><small>取引履歴を見る</small></button>

</div>

<div class="heading">最近の入出金</div>

<div class="panel" id="recent"></div>

<button class="more" onclick="showPage('history')">すべての明細を見る　›</button>

</section>

<section id="history" class="page">

<div class="heading">入出金明細</div>

<div class="panel" id="alltx"></div>

</section>

<section id="account" class="page">

<div class="heading">口座情報</div>

<div class="panel" style="padding:0 16px">

<div class="info"><span>銀行名</span><strong>セブン銀行（デモ表示）</strong></div>

<div class="info"><span>支店名</span><strong>マイ支店（仮）</strong></div>

<div class="info"><span>口座種別</span><strong>普通預金</strong></div>

<div class="info"><span>口座番号</span><strong>2284117</strong></div>

<div class="info"><span>口座名義</span><strong>ご本人名義（仮）</strong></div>

</div>



</section>

<div class="notice">マイセブン銀行｜個人用。</div>

</main>

<nav>

<button class="active" data-page="home" onclick="showPage('home')">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 9-8 9 8M5 10v10h14V10M9 20v-6h6v6"/></svg>ホーム</button>

<button data-page="history" onclick="showPage('history')">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v17H5zM8 8h8M8 12h8M8 16h5"/></svg>入出金明細</button>

<button data-page="account" onclick="showPage('account')">

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-8 8-8s8 3 8 8"/></svg>口座情報</button>

</nav>

<div class="toast" id="toastbox"></div>

<script>

const transactions=[

{n:"ATM支払",d:"2026/10/06",a:"−￥100,000"},

{n:"ATM支払",d:"2026/10/03",a:"−￥430,000"},

{n:"ATM支払",d:"2026/10/02",a:"−￥100,000"},

{n:"ATM支払",d:"2026/10/02",a:"−￥98,000"},

{n:"振込 ヘヤ ショウタ",d:"2026/09/30",a:"+￥777,000",p:true}

];

function row(t){

const icon=t.p?'<path d="M12 19V5M6 11l6-6 6 6"/>' : '<path d="M12 5v14M6 13l6 6 6-6"/>';

return '<div class="tx"><div class="txicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+icon+'</svg></div><div class="txinfo"><div class="txname">'+t.n+'</div><div class="date">'+t.d+'</div></div><div class="amount '+(t.p?'plus':'')+'">'+t.a+'</div></div>';

}

document.getElementById("recent").innerHTML=transactions.slice(0,3).map(row).join("");

document.getElementById("alltx").innerHTML=transactions.map(row).join("");

function showPage(id){

document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));

document.getElementById(id).classList.add("active");

document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===id));

window.scrollTo({top:0,behavior:"smooth"});

}

let toastTimer;

function toast(message){

const el=document.getElementById("toastbox");

el.textContent=message;el.style.display="block";

clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display="none",2000);

}

</script>

</body>

</html>
